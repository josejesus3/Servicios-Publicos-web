<div class="row g-4 mb-4">

        <div class="col-xl-3 col-lg-6">

            <mat-card class="stat-card orange">

                <mat-card-content>

                    <div class="d-flex align-items-center">

                        <div class="stat-icon">
                            <mat-icon>group</mat-icon>
                        </div>

                        <div class="ms-3">

                            <h2>{{users.length}}</h2>

                            <p>Usuarios registrados</p>

                        </div>

                    </div>

                </mat-card-content>

            </mat-card>

        </div>

        <div class="col-xl-3 col-lg-6">

            <mat-card class="stat-card blue">

                <mat-card-content>

                    <div class="d-flex align-items-center">

                        <div class="stat-icon">

                            <mat-icon>apartment</mat-icon>

                        </div>

                        <div class="ms-3">

                            <h2>{{areas.length}}</h2>

                            <p>Áreas activas</p>

                        </div>

                    </div>

                </mat-card-content>

            </mat-card>

        </div>

        <div class="col-xl-3 col-lg-6">

            <mat-card class="stat-card green">

                <mat-card-content>

                    <div class="d-flex align-items-center">

                        <div class="stat-icon">

                            <mat-icon>event</mat-icon>

                        </div>

                        <div class="ms-3">

                            <h2>{{incidentes.length}}</h2>

                            <p>Reportes totales</p>


                        </div>

                    </div>

                </mat-card-content>

            </mat-card>

        </div>

        <div class="col-xl-3 col-lg-6">

            <mat-card class="stat-card purple">

                <mat-card-content>

                    <div class="d-flex align-items-center">

                        <div class="stat-icon">

                            <mat-icon>task_alt</mat-icon>

                        </div>

                        <div class="ms-3">

                            <h2>{{atendidos}}</h2>

                            <p>Reportes atendidos</p>

                        </div>

                    </div>

                </mat-card-content>

            </mat-card>

        </div>

    </div>
