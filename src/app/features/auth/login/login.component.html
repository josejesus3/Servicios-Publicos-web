<div class="main-auth-container">

    <!-- Fondo -->
    <img src="paseo-rosas2.jpeg" class="bg-image" alt="Fondo El Grullo">

    <div class="container">

        <div class="login-card">

            <div class="row g-0">

                <!-- Formulario -->
                <div class="col-lg-8 col-12">
                    <div class="left-side">

                        <p class="fw-medium fs-2 m-0">
                            Iniciar sesión
                        </p>

                        <p class="subtitle">
                            Accede a tu cuenta para continuar.
                        </p>

                        <form>

                            <div>
                                <label class="form-label">
                                    Correo Electrónico
                                </label>

                                <input type="email" name="email" class="form-control" [(ngModel)]="email" placeholder="Escribe un correo electrónico...">
                            </div>

                            <div>
                                <label class="form-label">
                                    Contraseña
                                </label>

                                <div class="password-box">
                                    <input type="password" name="password" class="form-control" [(ngModel)]="password" placeholder="Escribe una contraseña">

                                    <i class="bi bi-eye"></i>
                                </div>
                            </div>

                            <div class="d-flex flex-column options">

                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input">

                                    <label class="form-check-label">
                                        Recordarme
                                    </label>
                                </div>

                                <a href="#" class="text-secondary text-decoration-none">
                                    ¿Olvidaste tu contraseña?
                                </a>

                            </div>

                            <button type="submit" class="btn btn-login w-100" (click)="login()">
                                <i class="bi bi-send"></i>
                                Iniciar sesión
                            </button>

                        </form>

                        <div class="register">
                            <p>
                                ¿No tienes una cuenta?
                                <a href="#" class="text-decoration-none">
                                    Regístrate aquí
                                </a>
                            </p>
                        </div>

                        <div class="terms">
                            Al iniciar sesión, aceptas nuestros
                            Términos y Condiciones y Aviso de Privacidad.
                        </div>

                    </div>
                </div>

                <!-- Panel derecho -->
                <div class="col-lg-4 d-none d-lg-block">

                    <div class="right-side">

                        <div class="img-logo">
                            <img src="logoGb.png" alt="Logo Gobierno Municipal">
                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
