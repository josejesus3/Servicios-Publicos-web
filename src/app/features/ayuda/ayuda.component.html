<div class="row">
    <div>
        <h3 style="color: #2c2c2c; font-weight: 400; line-height: 0.5;">Ayuda</h3>
        <p style="color: #626060f1; font-size: 18px;">Encontraras respuestas a las preguntas mas frecuentes sobre la
            plataforma.</p>
    </div>
    <div class="col-12 col-lg-4">
        <div class="custom-box">
            <div class="box-header">
                <h5>Temas</h5>
            </div>
            <app-ayuda-card (activeAyuda)="onActiveAyuda($event)"></app-ayuda-card>
        </div>
    </div>
    <div class="col-12 col-lg-8">
        <div class="custom-box">
            <div class="box-header">
                <h5>Preguntas frecuentes</h5>
            </div>
            <app-form-list [activeButtos]="activeButton"></app-form-list>
        </div>
    </div>
</div>
