<div class="row p-2 ">
    @for (contacto of contactInfo; track $index) {

    <div class="d-flex m-1">
        <i class="{{contacto.icon}}"
            style="color: #ff6a00; font-size:28px; margin-top: 10px; margin-right: 20px;margin-left: 20px;"></i>

        <div class="contact-text">
            <h4 class="contact-title m-0">{{contacto.title}}</h4>
            <small class="contact-line"> {{contacto.lines[0]}}</small>
            <br>
            <small class="contact-line"> {{contacto.lines[1]}}</small>
        </div>

    </div>


    }
    <div class="box-header">
        <h5>Redes sociales</h5>
    </div>
    <div class="d-flex gap-3 justify-content-around">

        <a *ngFor="let redes of socialNetworks" href="{{redes.url}}">
            <i class="{{redes.icon}} fs-1" [ngStyle]="{'color':redes.color}"></i>
        </a>
    </div>
</div>
