<div class="row g-4">
    <div class="col-12 col-lg-8 ">
        <div class="custom-box">
            <div class="box-title">
                <a>
                    <i class="bi bi-clock-history me-2"></i>
                    Últimos Reportes
                </a>
            </div>
            <div class="incident-container">
                @if (incident &&incident.length>0) {
                @for (item of incident.slice(0,5); track $index) {
                <div class="custom-card">
                    <div class="row align-items-center g-3">
                        <!-- Icono + Información -->
                        <div class="col-lg-6 col-md-6">
                            <div class="incident-info">
                                <div class="circle">
                                    <i [class]="getIconos(item.area_id)"></i>
                                </div>
                                <div class="incident-text">
                                    <h6 class="incident-title">
                                        {{item.title}}
                                    </h6>
                                    <p class="incident-description">
                                        {{item.description}}
                                    </p>
                                </div>
                            </div>
                        </div>
                        <!-- Fecha -->
                        <div class="col-lg-2 col-md-2">
                            <div class="incident-date">
                                {{item.created_at | date:'dd MMM yyyy'}}
                                <br>
                                <small>
                                    {{item.created_at | date:'hh:mm a'}}
                                </small>
                            </div>
                        </div>
                        <!-- Estado -->
                        <div class="col-lg-4 col-md-4">
                            <div class="card-status" [ngStyle]="{
                            'background': getStatus(item.status)}">{{item.status}} </div>
                        </div>
                    </div>
                </div>
                }

                }@else{
                <div class="d-flex justify-content-center align-items-center " style="height: 300px;">
                    <h3 class="m-0 text-secondary"><i class="bi bi-inbox fs-1 text-secondary"></i> No hay reportes</h3>
                </div>
                }
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-4">
        <div class="custom-box">
            <div class=" d-flex box-title">
                <a href=""><i class="bi bi-graph-up "></i> Resumen de Reportes atendidos</a>
            </div>
        </div>
    </div>
</div>
